[tool.poetry]
name = "liq-mtf"
version = "0.1.0"
description = "Binance Liquidity Detector Agent"
authors = ["Team <team@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
lightgbm = "^4.5.0"
numpy = "^2.0.0"
orjson = "^3.10.0"
pandas = "^2.2.0"
pyarrow = "^17.0.0"
requests = "^2.32.0"
scikit-learn = "^1.5.0"
websockets = "^13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
